name: Test action
permissions:
  contents: read

on:
  push:
    branches:
      - main
  pull_request:
  merge_group:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      - name: Set Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          cache: 'pnpm'
          node-version: 24.x
      - run: pnpm install
      - run: pnpm build
      - run: pnpm lint
      - run: pnpm test:coverage
        shell: bash
      - name: Upload coverage artifact
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report-typescript
          path: coverage/cobertura-coverage.xml
  test_action:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install CLI
        uses: ./
        with:
          version: latest
        env:
          RUNNER_DEBUG: 1
      - name: Find CLI
        run: ls -lR $RUNNER_TOOL_CACHE/scw
      - name: Use CLI
        run: scw info
  test_action_usage:
    if: github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name == 'scaleway/action-scw' && github.actor != 'dependabot[bot]')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Use CLI
        id: cli
        uses: ./
        with:
          args: instance server-type list
          version: v2.54.0
          access-key: ${{ secrets.SCW_ACCESS_KEY }}
          secret-key: ${{ secrets.SCW_SECRET_KEY }}
          default-project-id: ${{ secrets.SCW_DEFAULT_PROJECT_ID }}
          default-organization-id: ${{ secrets.SCW_DEFAULT_ORGANIZATION_ID }}
      - name: Check output
        run: |
          [ "$( echo '${{ steps.cli.outputs.json }}' | jq -r 'type')" = "array" ]
      - name: Use CLI manually
        id: cli_manual
        run: echo "json=$(scw -o json instance server-type list)" >> $GITHUB_OUTPUT
        env:
          SCW_ACCESS_KEY: ${{ secrets.SCW_ACCESS_KEY }}
          SCW_SECRET_KEY: ${{ secrets.SCW_SECRET_KEY }}
          SCW_DEFAULT_PROJECT_ID: ${{ secrets.SCW_DEFAULT_PROJECT_ID }}
          SCW_DEFAULT_ORGANIZATION_ID: ${{ secrets.SCW_DEFAULT_ORGANIZATION_ID }}
      - name: Check output
        run: |
          [ "$( echo '${{ steps.cli_manual.outputs.json }}' | jq -r 'type')" = "array" ]
  test_action_export_config:
    if: github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name == 'scaleway/action-scw' && github.actor != 'dependabot[bot]')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install CLI and export config
        uses: ./
        with:
          export-config: true
          version: v2.54.0
          access-key: ${{ secrets.SCW_ACCESS_KEY }}
          secret-key: ${{ secrets.SCW_SECRET_KEY }}
          default-project-id: ${{ secrets.SCW_DEFAULT_PROJECT_ID }}
          default-organization-id: ${{ secrets.SCW_DEFAULT_ORGANIZATION_ID }}
      - name: Use CLI with exported config
        uses: ./
        id: cli
        with:
          args: instance server-type list
      - name: Check output
        run: |
          [ "$( echo '${{ steps.cli.outputs.json }}' | jq -r 'type')" = "array" ]
      - name: Use CLI manually with exported config
        id: cli_manual
        run: echo "json=$(scw -o json instance server-type list)" >> $GITHUB_OUTPUT
      - name: Check output
        run: |
          [ "$( echo '${{ steps.cli_manual.outputs.json }}' | jq -r 'type')" = "array" ]
      - name: Export again
        uses: ./
        with:
          export-config: true
          version: v2.29.0
          access-key: ${{ secrets.SCW_ACCESS_KEY }}
          secret-key: ${{ secrets.SCW_SECRET_KEY }}
          default-project-id: ${{ secrets.SCW_DEFAULT_PROJECT_ID }}
          default-organization-id: ${{ secrets.SCW_DEFAULT_ORGANIZATION_ID }}
  test_action_save_config:
    if: github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name == 'scaleway/action-scw' && github.actor != 'dependabot[bot]')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install CLI and save config
        uses: ./
        with:
          save-config: true
          version: v2.54.0
          access-key: ${{ secrets.SCW_ACCESS_KEY }}
          secret-key: ${{ secrets.SCW_SECRET_KEY }}
          default-project-id: ${{ secrets.SCW_DEFAULT_PROJECT_ID }}
          default-organization-id: ${{ secrets.SCW_DEFAULT_ORGANIZATION_ID }}
      - name: Use CLI manually with saved config
        id: cli_manual
        run: echo "json=$(scw -o json instance server-type list)" >> $GITHUB_OUTPUT
      - name: Check output
        run: |
          [ "$( echo '${{ steps.cli_manual.outputs.json }}' | jq -r 'type')" = "array" ]
      - name: Check CLI config
        uses: ./
        with:
          version: v2.29.0
          args: config info
        env:
          RUNNER_DEBUG: true
      - name: Use CLI with saved config
        uses: ./
        id: cli
        with:
          version: v2.29.0
          args: instance server-type list
      - name: Check output
        run: |
          [ "$( echo '${{ steps.cli.outputs.json }}' | jq -r 'type')" = "array" ]
      - name: Save again
        uses: ./
        with:
          save-config: true
          version: v2.29.0
          access-key: ${{ secrets.SCW_ACCESS_KEY }}
          secret-key: ${{ secrets.SCW_SECRET_KEY }}
          default-project-id: ${{ secrets.SCW_DEFAULT_PROJECT_ID }}
          default-organization-id: ${{ secrets.SCW_DEFAULT_ORGANIZATION_ID }}
  upload-coverage-typescript:
    needs: lint
    if: ${{ !cancelled() && needs.lint.result == 'success' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      code-quality: write
    steps:
      - name: Download coverage artifact
        uses: actions/download-artifact@v8
        with:
          name: coverage-report-typescript
      - uses: actions/upload-code-coverage@v1
        with:
          file: cobertura-coverage.xml
          language: TypeScript
          label: code-coverage-agent
